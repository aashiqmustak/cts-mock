name: priorx
description: "MediAuth AI — AI-Powered Prior Authorization Automation Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # HTTP Client
  dio: ^5.8.0

  # Charts
  fl_chart: ^0.70.2

  # Animations
  flutter_animate: ^4.5.2

  # Fonts
  google_fonts: ^6.2.1

  # Data Tables
  data_table_2: ^2.5.14

  # PDF Generation
  pdf: ^3.11.3
  printing: ^5.14.2

  # Icons
  phosphor_flutter: ^2.1.0

  # Supabase
  supabase_flutter: ^2.15.4

  # Responsive Layout
  responsive_framework: ^1.5.1

  # Shimmer / Skeleton Loading
  shimmer: ^3.0.0

  # Local Storage
  shared_preferences: ^2.3.5

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  equatable: ^2.0.7

  # Misc
  cupertino_icons: ^1.0.8
  collection: ^1.19.1
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
